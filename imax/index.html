<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MDSPOTY · IMAX 좌석 분석</title>
<style>

button,input,select{font:inherit}.app{width:min(100%,480px);margin:auto;min-height:100vh}.screen{padding:28px 20px 40px}.hidden{display:none}

.form{margin-top:40px}.label{font-size:13px;font-weight:800;margin:0 0 10px}.select,.input{width:100%;height:54px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:0 15px;font-size:16px;outline:0}.input{text-transform:uppercase}.select:focus,.input:focus{border-color:#aaa}.input.invalid{border-color:#d33}
.btn{width:100%;height:56px;border:0;border-radius:15px;background:#111;color:#fff;font-size:16px;font-weight:850;margin-top:14px;cursor:pointer}.hint{font-size:12px;color:#999;margin-top:9px}

.section{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px}.section h2{font-size:15px;margin:0 0 14px}
.map-viewport{width:100%;overflow:hidden;border-radius:16px;background:#fafaf8;position:relative}.map-canvas{position:relative;transform-origin:top left}.map-screen{position:absolute;border-top:3px solid #bbb;border-radius:50%;opacity:.8}.door{position:absolute;background:#ddd;border-radius:3px}.seat{position:absolute;width:38px;height:38px;border:1px solid #aaa;border-radius:7px;background:#fff;color:#555;font-size:9px;display:flex;align-items:center;justify-content:center;line-height:1;user-select:none}.seat.unavailable{opacity:.5}.seat.preferential{background:#f3f3ef}.seat.selected{background:#111;color:#fff;border-color:#111;z-index:5;box-shadow:0 0 0 3px #fff,0 0 0 5px #111}.map-note{font-size:11px;color:#999;text-align:center;margin-top:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f7f7f4;border-radius:14px;padding:13px}.stat small{display:block;color:#888;font-size:11px;margin-bottom:5px}.stat b{font-size:15px}

    <button class="btn" id="analyze">좌석 분석하기</button>
  </div>
</section>

  <button class="btn save" id="saveImage">결과 이미지 저장</button>
  <button class="btn retry" id="retry">다른 좌석 분석하기</button>
</section>
</div>

function isInRecommendationRange(id,range){

function scoreByRecommendations(type,row,num){
 const id=row+num,seat=findSeat(type,id),all=seatsOf(type);
 const left=Math.min(...all.map(item=>item.left)),right=Math.max(...all.map(item=>item.left)),top=Math.min(...all.map(item=>item.top)),bottom=Math.max(...all.map(item=>item.top));
 const depth=(seat.top-top)/Math.max(1,bottom-top),centerX=(left+right)/2;
 const side=Math.abs((seat.left+seat.width/2)-centerX)/Math.max(1,(right-left)/2);
 const bestSeats=all.filter(item=>recommendationZone(type,item.id)==="best");
 const idealDepth=bestSeats.length?bestSeats.reduce((sum,item)=>sum+(item.top-top)/Math.max(1,bottom-top),0)/bestSeats.length:.58;
 const rowSeats=all.filter(item=>item.id.match(/^[A-Z]+/)[0]===row);
 const rowEdge=Math.max(...rowSeats.map(item=>Math.abs(item.left+item.width/2-centerX)));
 const edgeRatio=Math.abs(seat.left+seat.width/2-centerX)/Math.max(1,rowEdge);
 let score=94-Math.abs(depth-idealDepth)*48-side*26;
 if(edgeRatio>=.92)score-=12;else if(edgeRatio>=.78)score-=5;
 const zone=recommendationZone(type,id);
 if(zone==="best"||zone==="immersion")score=Math.max(score,90);
 if(zone==="extreme"){
   const extremeSeats=all.filter(item=>recommendationZone(type,item.id)==="extreme");
   const extremeCenter=extremeSeats.reduce((sum,item)=>sum+item.left+item.width/2,0)/Math.max(1,extremeSeats.length);
   const extremeSpan=Math.max(...extremeSeats.map(item=>Math.abs(item.left+item.width/2-extremeCenter)),1);
   score=Math.max(score,Math.abs(seat.left+seat.width/2-extremeCenter)/extremeSpan>=.82?78:80);
 }
 if(zone==="avoid")score=Math.min(score,69);
 if(zone==="why")score=Math.min(score,79);
 if(zone!=="best"&&zone!=="immersion")score=Math.min(score,89);
 score=Math.round(Math.max(10,Math.min(100,score)));
 const tag={best:"최고의 자리",immersion:"몰입석",extreme:"찐덕후",avoid:"비추천 좌석",why:"WHY IMAX"}[zone]||"일반 좌석";
 const grade=score>=90?"A":score>=80?"B":score>=70?"C":"D";
 return {score,grade,tag,rowText:depth<idealDepth-.18?"앞쪽":depth>idealDepth+.22?"후방":"좋은 거리",colText:side<.18?"정중앙":side<.5?"중앙에 가까움":"사이드"};
}
function screenRank(type){
 const width=Number(HALL_DETAILS[type].screen.match(/[\d.]+/)[0]);
 const uniqueWidths=[...new Set(Object.values(HALL_DETAILS).map(detail=>Number(detail.screen.match(/[\d.]+/)[0])))].sort((a,b)=>b-a);
 return `전국 IMAX 가로 폭 기준 ${uniqueWidths.indexOf(width)+1}위`;

function scoreRegional(type,row,num){
 const zone=regionalZone(type,row+num),base={sweet:100,exp:92,ext:84,why:76}[zone]||70;
 const rowIndex=REGIONAL[type].rows.indexOf(row),rowCount=REGIONAL[type].rows.length;
 const central=Math.round(8-Math.abs(num-10.5)*0.8),distance=rowIndex<=2?-8:rowIndex<=4?0:rowIndex<=7?5:1;
 const score=Math.max(10,Math.min(100,Math.round(base+central+distance)));
 const tag={sweet:"최고의 자리",exp:"몰입석",ext:"찐덕후",why:"WHY IMAX"}[zone]||"일반 좌석";
 const grade=score>=90?"A":score>=80?"B":score>=70?"C":"D";
 const rowText=rowIndex<=2?"앞쪽":rowIndex>=rowCount-2?"후방":"좋은 거리";
 const colText=Math.abs(num-10.5)<=2?"정중앙":Math.abs(num-10.5)<=6?"중앙에 가까움":"사이드";
 return {score,grade,tag,rowText,colText};
}
function scoreSeat(type,row,num){
  /*
   * MDSPOTY 좌석 평가 v5
   *
   * 등급 정책
   * A : 90~100
   * B : 80~89
   * C : 70~79
   * D : 10~69
   *
   * 용산 IMAX 기준 목표:
   * A3 = 10
   * A23 = 35
   * I1 = 20
   * G4 = 35
   *
   * 추천표와의 정합성:
   * - SweetSpot(J,K,L / 11~34): 전부 A
   * - Experienced(H,I / 13~32): 전부 A
   * - Extremer(F,G / 16~29): 대부분 B, 일부 C
   *
   * ※ 기존 L14=85 목표는 SweetSpot 전체 A 정책과 충돌하므로
   *   v4에서는 L14를 A등급으로 우선한다.
   */

  if(type==="yongsan"){
    // 해외 IMAX 조사 원칙 반영: 좌석 번호가 아니라 실제 좌석 좌표의
    // 스크린 중앙 이탈량을 사용한다. 통로·좌석 블록 때문에 번호상 중앙과
    // 실제 시야 중앙이 달라지는 문제를 줄인다.
    const actualSeat=findSeat(type,row+num);
    const centerSeat=findSeat(type,"J23");
    const seatCenter=actualSeat.left+actualSeat.width/2;
    const screenCenter=centerSeat.left+centerSeat.width/2;
    const d=Math.abs(seatCenter-screenCenter)/38;
    const rowSeats=seatsOf(type).filter(item=>item.id.match(/^[A-Z]+/)[0]===row);
    const rowEdge=Math.max(...rowSeats.map(item=>Math.abs(item.left+item.width/2-screenCenter)));
    const edgeRatio=d/(rowEdge/38);

    // 행별 기본 점수. 기존보다 전반적으로 관대하게 조정해
    // 좋은 거리의 일반석도 C/B등급을 받기 쉽게 설계.
    const rowBase={
      A:40, B:51, C:62, D:72, E:79,
      F:85, G:89, H:96, I:99, J:100,
      K:100, L:100, M:92, N:86, O:77, P:68
    };

    // 좌우 감점.
    // 앞쪽일수록 좌우 시야각의 불리함이 상대적으로 커지고,
    // SweetSpot(J~L)은 감점을 작게 해서 11~34 전체가 A가 되도록 한다.
    let sideRate;
    if(row==="J" || row==="K" || row==="L"){
      sideRate = 0.18;
    }else if(row==="H" || row==="I"){
      sideRate = 0.55;
    }else if(row==="F" || row==="G"){
      sideRate = 0.70;
    }else{
      sideRate = 1.05;
    }

    let score=rowBase[row] - d*sideRate;

    // 각 행의 실제 끝 좌석은 전방일수록 화면 왜곡·목 회전이 커진다는
    // 해외 관람 사례를 반영해 강하게 감점한다.
    if(edgeRatio>=.92) score-=12;
    else if(edgeRatio>=.78) score-=5;

    // 사용자가 지정한 용산 기준점 보정
    if(row==="A" && num===3) score=10;
    if(row==="A" && num===23) score=35;
    if(row==="I" && num===1) score=20;
    if(row==="G" && num===4) score=35;

    const isBest=["J","K","L"].includes(row) && num>=11 && num<=34;
    const isImmersive=["H","I"].includes(row) && num>=13 && num<=32;
    const isExtreme=["F","G"].includes(row) && num>=16 && num<=29;

    // 추천 구간은 최소 등급을 강제한다.
    // SweetSpot 전체 A
    if(isBest){
      score=Math.max(score,90);
    }

    // Experienced는 전부 A
    if(isImmersive){
      score=Math.max(score,90);
    }

    // Extremer는 대부분 B, 중앙에서 먼 일부는 C가 가능
    if(isExtreme){
      // F는 바깥쪽이 조금 더 불리하고 G는 조금 더 유리하게
      const minScore=(row==="G" && num>=18 && num<=27)?82:78;
      score=Math.max(score,minScore);
    }

    // A등급은 추천표에서 확인된 최고의 자리·몰입석에만 부여한다.
    if(!isBest&&!isImmersive) score=Math.min(score,89);
    score=Math.round(Math.max(10,Math.min(100,score)));

    let tag="일반 좌석";
    if(isBest){
      tag="최고의 자리";
    }else if(isImmersive){
      tag="몰입석";
    }else if(isExtreme){
      tag="찐덕후";
    }

    const grade=score>=90?"A":score>=80?"B":score>=70?"C":"D";

    const rowText=["A","B","C"].includes(row)?"매우 앞쪽":
      (["G","H","I","J","K","L"].includes(row)?"좋은 거리":"무난한 거리");

    const colText=d<=2?"정중앙":
      d<=6?"중앙에 가까움":
      d<=11?"측면에 가까움":"사이드";

    return {score,grade,tag,rowText,colText};
  }

  // 용산을 제외한 상영관은 PNG 추천 구역의 최고의 자리 좌표를
  // 기준 거리로 사용한다. 실제 좌석 배치를 유지하면서 지점별 명당을 보장한다.
  if(window.RECOMMENDATION_ZONES?.[type])return scoreByRecommendations(type,row,num);
  if(REGIONAL[type]) return scoreRegional(type,row,num);
  if(OFFICIAL_SEAT_MAPS[type]) return scoreOfficial(type,row,num);

  // 센텀시티 IMAX
  // 센텀 추천표 반영:
  // - A~B열: 최후의 용자석(매우 앞쪽) → 강한 감점
  // - C~D열: 사이드 좌석 → 앞쪽 + 측면 감점
  // - E 18~28: Extremer → 대부분 B, 일부 C
  // - F,G 16~30: Experienced → A/B
  // - H,I 14~32: SweetSpot → 전부 A
  // - J~L: SweetSpot과 가까운 좋은 거리지만, 중앙에서 멀어질수록 감점
  const d=Math.abs(num-23);

  const rowBase={
    A:34, B:43, C:54, D:64,
    E:79, F:88, G:94, H:100, I:100, J:98, K:94, L:88
  };

  // 센텀은 스크린과 앞열 사이 거리가 짧고 경사도도 낮아
  // 앞열의 좌우 시야각 불리함이 크게 느껴지도록 설정.
  let sideRate;
  if(["H","I"].includes(row)){
    sideRate=0.40;
  }else if(["J","K","L"].includes(row)){
    sideRate=0.55;
  }else if(["F","G"].includes(row)){
    sideRate=0.75;
  }else if(row==="E"){
    sideRate=0.95;
  }else{
    sideRate=1.30;
  }

  let score=rowBase[row]-d*sideRate;

  // 좌우 끝자리: 센텀은 화면과 좌석 간 거리가 짧기 때문에
  // 단순 거리보다 측면 시야각의 불리함을 강하게 반영.
  if(num<=3 || num>=43) score-=8;
  else if(num<=6 || num>=40) score-=4;

  // C~D열은 앞쪽이면서 사이드가 특히 불리하므로 추가 감점.
  if(["C","D"].includes(row) && (num<=8 || num>=38)) score-=8;

  // A~B열은 최후의 용자석: 좌우 위치와 무관하게 낮은 평가.
  if(["A","B"].includes(row)) score=Math.min(score,59);

  // 추천 구간의 등급 분포를 강제한다.
  // SweetSpot(H,I 14~32): 전부 A
  if(["H","I"].includes(row) && num>=14 && num<=32){
    score=Math.max(score,90);
  }

  // Experienced(F,G 16~30): A 또는 B
  if(["F","G"].includes(row) && num>=16 && num<=30){
    score=Math.max(score,80);
  }

  // Extremer(E 18~28): 대부분 B, 가장자리 쪽 일부 C 허용
  if(row==="E" && num>=18 && num<=28){
    const minScore=(num>=20 && num<=26)?80:74;
    score=Math.max(score,minScore);
  }

  score=Math.round(Math.max(10,Math.min(100,score)));

  let tag="일반 좌석";
  if(["H","I"].includes(row)&&num>=14&&num<=32){
    tag="최고의 자리";
  }else if(["F","G"].includes(row)&&num>=16&&num<=30){
    tag="몰입석";
  }else if(row==="E"&&num>=18&&num<=28){
    tag="찐덕후";
  }else if(["A","B"].includes(row) || (["C","D"].includes(row)&&(num<=8||num>=38))){
    tag="최후의 용자석";
  }

  const grade=score>=90?"A":score>=80?"B":score>=70?"C":"D";
  const rowText=["A","B"].includes(row)?"매우 앞쪽":
    (["C","D"].includes(row)?"앞쪽":"좋은 거리");
  const colText=d<=2?"정중앙":
    d<=6?"중앙에 가까움":
    d<=11?"측면에 가까움":"사이드";

  return {score,grade,tag,rowText,colText};
}

function scoreOfficial(type,row,num){
 const t=THEATERS[type],seat=findSeat(type,row+num),all=seatsOf(type);
 const left=Math.min(...all.map(item=>item.left)),right=Math.max(...all.map(item=>item.left)),top=Math.min(...all.map(item=>item.top)),bottom=Math.max(...all.map(item=>item.top));
 const depth=(seat.top-top)/Math.max(1,bottom-top),side=Math.abs(seat.left-(left+right)/2)/Math.max(1,(right-left)/2);
 const score=Math.round(Math.max(35,Math.min(95,94-Math.abs(depth-.58)*48-side*26)));
 const grade=score>=90?"A":score>=80?"B":score>=70?"C":"D";
 const tag=depth<.28?"앞쪽 좌석":depth>.82?"후방 좌석":side<.18?"중앙 좌석":"일반 좌석";
 return {score,grade,tag,rowText:depth<.28?"앞쪽":depth>.82?"후방":"좋은 거리",colText:side<.18?"정중앙":side<.5?"중앙에 가까움":"사이드"};
}

function renderMap(type,id){
 const t=THEATERS[type], canvas=$("mapCanvas"), viewport=$("mapViewport");
 canvas.innerHTML=""; canvas.style.width=t.width+"px"; canvas.style.height=t.height+"px";
 const isOfficial=!!OFFICIAL_SEAT_MAPS[type],isRegional=!!REGIONAL[type]&&!isOfficial,screen=document.createElement("div");screen.className="map-screen";screen.style.left=isRegional?"85px":isOfficial?Math.round(t.width*.18)+"px":"280px";screen.style.top="8px";screen.style.width=isRegional?"750px":isOfficial?Math.round(t.width*.64)+"px":"1370px";screen.style.height="35px";canvas.appendChild(screen);
 $("mapNote").textContent=isOfficial?"공식 CGV 예매 페이지의 실제 좌석 좌표를 반영했습니다. 연한 회색은 우대석입니다.":isRegional?"추천 자료의 좌석 구역을 구조화한 안내 배치도입니다. 색상은 추천 등급, 연한 회색은 휠체어석입니다.":"실제 CGV 좌석 배치의 위치를 기준으로 표시했습니다. 연한 회색은 휠체어석입니다.";
 // Doors are included only as visual landmarks; seat coordinates themselves come directly from the supplied CGV map data.
 const doors=OFFICIAL_SEAT_MAPS[type]?.doors||(type==="yongsan"?[{left:665,top:19},{left:1292,top:19}]:[]);
 doors.forEach(({left,top})=>{const d=document.createElement("div");d.className="door";d.style.left=left+"px";d.style.top=top+"px";d.style.width="38px";d.style.height="19px";canvas.appendChild(d)});
 const chosen=findSeat(type,id);
 seatsOf(type).forEach(s=>{
   const el=document.createElement("div");el.className="seat "+regionalZone(type,s.id);
   el.textContent=s.id;el.style.left=s.left+"px";el.style.top=s.top+"px";
   if(s.id===id)el.classList.add("selected");
   if(s.preferential)el.classList.add("preferential");
   canvas.appendChild(el);
 });
 const scale=Math.min(1,(viewport.clientWidth-2)/t.width);
 canvas.style.transform=`scale(${scale})`;
 viewport.style.height=(t.height*scale+2)+"px";
 setTimeout(()=>{const el=canvas.querySelector(".selected");if(el){const x=el.offsetLeft*scale,y=el.offsetTop*scale;viewport.scrollLeft=Math.max(0,x-viewport.clientWidth/2);}},0);
}
function analyze(){
 const type=$("theater").value, raw=$("seatInput").value.trim().toUpperCase();
 if(THEATERS[type].infoOnly){showInfoOnly(type);return}
 const m=raw.match(/^([A-P])(\d{1,2})$/);
 if(!m){$("seatInput").classList.add("invalid");return}
 const id=m[1]+(+m[2]); if(!findSeat(type,id)){alert("선택한 상영관에 존재하지 않는 좌석입니다.");return}
 $("seatInput").classList.remove("invalid");
 const r=withFactors(scoreSeat(type,m[1],+m[2])),t=THEATERS[type],info=HALL_INFO[type];
 $("home").classList.add("hidden");$("result").classList.remove("hidden");
 $("resultTheater").textContent=t.name;$("captureTheater").textContent=t.name;$("resultSeat").textContent=id;
 $("score").closest(".score-card").style.display="";$("mapViewport").closest(".section").style.display="";
 $("score").textContent=r.score+"점";$("grade").textContent=r.grade+"등급";$("tag").textContent=r.zone;$("tag").style.display=r.zone==="일반 좌석"?"none":"inline-block";
 $("hallName").textContent=t.name;$("hallRatio").textContent=HALL_DETAILS[type].ratio;$("hallScreen").textContent=HALL_DETAILS[type].screen;$("hallScreenRank").textContent=screenRank(type);$("hallInfo").textContent=info.text;$("hallRecommend").textContent=info.recommend;
 $("desc").textContent=r.score>=85?"화면과의 거리와 좌우 위치가 좋아 추천도가 높은 좌석입니다.":r.score>=70?"전체적으로 관람하기 좋은 좌석입니다.":r.score>=50?"관람은 가능하지만 더 좋은 위치의 좌석을 선택할 수 있습니다.":"화면과의 거리 또는 좌우 위치 때문에 추천도가 낮은 좌석입니다.";
 requestAnimationFrame(()=>renderMap(type,id));
}

 $("seatInput").classList.remove("invalid");$("home").classList.add("hidden");$("result").classList.remove("hidden");

 $("hallName").textContent=t.name;$("hallRatio").textContent=HALL_DETAILS[type].ratio;$("hallScreen").textContent=HALL_DETAILS[type].screen;$("hallScreenRank").textContent=screenRank(type);$("hallInfo").textContent="좌석 배치와 추천 구역은 자료 확인 후 추가됩니다.\n"+info.text;$("hallRecommend").textContent=info.recommend;
}
async function saveResultImage(){
 const button=$("saveImage"),capture=$("resultCapture"),width=Math.ceil(capture.offsetWidth),height=Math.ceil(capture.offsetHeight);
 const clone=capture.cloneNode(true);clone.style.width=width+"px";clone.style.margin="0";
 const styles=[...document.querySelectorAll("style")].map(style=>style.textContent).join("\n");
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>${styles}</style>${clone.outerHTML}</div></foreignObject></svg>`;
 const url=URL.createObjectURL(new Blob([svg],{type:"image/svg+xml;charset=utf-8"}));
 const image=new Image();button.disabled=true;button.textContent="이미지 만드는 중…";
 try{
  await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=url});
  const canvas=document.createElement("canvas"),scale=2;canvas.width=width*scale;canvas.height=height*scale;
  const context=canvas.getContext("2d");context.scale(scale,scale);context.fillStyle=getComputedStyle(document.body).backgroundColor;context.fillRect(0,0,width,height);context.drawImage(image,0,0);
  const link=document.createElement("a");link.download=`MDSPOTY-${$("resultTheater").textContent.replace("CGV ","")}-${$("resultSeat").textContent}.png`;link.href=canvas.toDataURL("image/png");link.click();
 }catch(error){alert("이미지를 저장하지 못했습니다. 다시 시도해주세요.")}finally{URL.revokeObjectURL(url);button.disabled=false;button.textContent="결과 이미지 저장"}
}
$("analyze").onclick=analyze;
$("saveImage").onclick=saveResultImage;
$("theater").addEventListener("change",e=>{

 $("seatInput").placeholder=infoOnly?"좌석 배치 자료 수집 중":"예: G15";$("analyze").textContent=infoOnly?"상영관 정보 보기":"좌석 분석하기";
 $("seatInput").nextElementSibling.textContent=infoOnly?"상영관 사양과 추천 정도를 확인할 수 있어요.":"좌석 번호를 입력해주세요. 예: G15";
});
$("seatInput").addEventListener("keydown",e=>{if(e.key==="Enter")analyze()});
$("back").onclick=$("retry").onclick=()=>{$("result").classList.add("hidden");$("home").classList.remove("hidden");};
window.addEventListener("resize",()=>{if(!$("result").classList.contains("hidden")){const id=$("resultSeat").textContent;renderMap($("theater").value,id)}});
